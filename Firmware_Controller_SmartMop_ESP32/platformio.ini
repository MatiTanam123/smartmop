
; ==========================================
; PlatformIO Configuration
; ESP32 Smart Mop Robot
; ==========================================


[env:esp32dev]

; Platform dan Board
platform = espressif32
board = esp32dev
framework = arduino

; Upload Configuration
upload_speed = 460800

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library Dependencies
lib_deps =
    bblanchon/ArduinoJson@^7.4.3

; Build Configuration
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Library Dependency Finder
lib_ldf_mode = chain+

; Arduino ESP32 Core
platform_packages =
    framework-arduinoespressif32


